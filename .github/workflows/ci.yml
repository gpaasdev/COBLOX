name: COBLOX Engine Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Luau & RGS Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RGS Compliance & Luau Analyzer
        run: |
          python3 scripts/validate_rgs_compliance.py
          python3 scripts/analyze_luau.py
          python3 scripts/analyze_remotes.py
