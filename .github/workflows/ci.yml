name: COBLOX Engine Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Luau & RGS Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RGS Compliance & Luau Analyzer
        run: |
          python3 scripts/validate_rgs_compliance.py
          python3 scripts/analyze_luau.py
          python3 scripts/analyze_remotes.py

      - name: Secret Scanning Gate
        run: |
          echo "🔍 Checking for exposed secrets..."
          if grep -rn --include="*.luau" "discord.com/api/webhooks" src/; then
            echo "❌ ERROR: Hardcoded Discord Webhook found in src/" && exit 1
          fi
          echo "✅ Secret Scanning Passed."

      - name: Discord Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR=3066993
          else
            EMOJI="❌"
            COLOR=15158332
          fi
          curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "{\"embeds\":[{\"title\":\"${EMOJI} COBLOX CI/CD\",\"description\":\"Branch: \`${{ github.ref_name }}\`\\nCommit: \`${{ github.sha }}\`\\nStatus: **${STATUS}**\",\"color\":${COLOR},\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}" \
            "$WEBHOOK_URL"

