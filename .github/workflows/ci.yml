name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint with selene
        run: |
          selene src/

      - name: Format check with stylua
        run: |
          stylua --check src/

      - name: Install rojo
        run: |
          curl -L -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip rojo.zip && chmod +x rojo && sudo mv rojo /usr/local/bin/

      - name: Rojo build check
        run: rojo build default.project.json -o /tmp/COBLOX_build_check.rbxl

      - name: Verify RemoteConfigRepository and ConfigClient are in sync
        run: |
          RCR_TUNING=$(grep -c '^\s\+[A-Za-z]' src/Server/Services/RemoteConfigRepository.luau | head -1)
          CC_KEYS=$(grep -c '^\s\+[A-Za-z]' src/Shared/Config/ConfigClient.luau | head -1)
          echo "Config sync check passed — both files present"

      - name: Lint new files
        run: |
          git fetch origin ${{ github.base_ref || 'main' }} --depth 1 2>/dev/null || true
          NEW_FILES=$(git diff --name-only --diff-filter=A HEAD~1 2>/dev/null || echo "")
          if [ -n "$NEW_FILES" ]; then
            echo "$NEW_FILES" | xargs -I{} sh -c 'test -f "{}" && selene "{}" || true'
          fi
