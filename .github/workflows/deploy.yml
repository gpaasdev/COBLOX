name: CI/CD Open Cloud Deployment
# Required GitHub Secrets:
#   ROBLOX_OPEN_CLOUD_API_KEY — Open Cloud API key with universe.places:write scope
#   ROBLOX_UNIVERSE_ID — Universe ID for the COBLOX experience
#   ROBLOX_PLACE_ID — Main Realm place ID
#   ROBLOX_FAIRYTALE_PLACE_ID — Fairytale Realm place ID (must be set for Fairytale deploy)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Aftman (Rojo, Selene, Stylua)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Run Linter (Selene)
        run: selene src/

      - name: Build Main Place
        run: rojo build -o COBLOX_Production.rbxl

      - name: Publish Main Place to Roblox via Open Cloud API
        run: |
          curl -X POST \
            "https://apis.roblox.com/universes/v1/${{ secrets.ROBLOX_UNIVERSE_ID }}/places/${{ secrets.ROBLOX_PLACE_ID }}/versions?versionType=Published" \
            -H "x-api-key: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @COBLOX_Production.rbxl

  build-and-deploy-fairytale:
    runs-on: ubuntu-latest
    needs: build-and-deploy-main
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Aftman (Rojo, Selene, Stylua)
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Build Fairytale Place
        run: rojo build fairytale/default.project.json -o COBLOX_Fairytale.rbxl

      - name: Publish Fairytale Place to Roblox via Open Cloud API
        run: |
          curl -X POST \
            "https://apis.roblox.com/universes/v1/${{ secrets.ROBLOX_UNIVERSE_ID }}/places/${{ secrets.ROBLOX_FAIRYTALE_PLACE_ID }}/versions?versionType=Published" \
            -H "x-api-key: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @COBLOX_Fairytale.rbxl
