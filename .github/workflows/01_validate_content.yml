name: 01 Validate Content

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Content/Data/**/*.json'
  pull_request:
    paths:
      - 'Content/Data/**/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Validate schemas
        run: uv run tools/content_pipeline.py
