name: 02 Generate Registries

on:
  workflow_run:
    workflows: ["01 Validate Content"]
    types:
      - completed

jobs:
  generate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Run Content Pipeline
        run: uv run tools/content_pipeline.py

      - name: Commit Generated Luau Registries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/Shared/Config/Generated*.luau web/src/data/registry/
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "chore(registry): regenerate Luau registries and web JSON from Content/Data [skip ci]"
            git push
          fi

      - name: Upload Registry Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: registry-bundle
          path: web/src/data/registry/
